version: "3.9"

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://quantpulse:${POSTGRES_PASSWORD:-quantpulse}@postgres:5432/quantpulse
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantpulse}
      POSTGRES_DB: quantpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      api:
        condition: service_started

  beat:
    build: ./backend
    restart: unless-stopped
    <<: *backend-env
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      worker:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws/stream}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
