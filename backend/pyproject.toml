[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# h/l/c (high/low/close) is standard OHLCV naming in quant code
"app/services/indicators/ta.py" = ["E741"]
"app/services/backtest/engine.py" = ["E741"]
# conftest must set env vars before importing the app
"tests/conftest.py" = ["E402"]
